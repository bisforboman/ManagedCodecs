name: Mutation checks

# Breaks each guard listed in tools/mutation/mutations.py (the frame threading waits, and code that reproduces what
# FFmpeg does) and checks that a test fails: a guard no test covers shows as SURVIVED. On pull requests that change
# more than docs, and on demand. (Should it become a required check, docs-only pull requests would wait for it
# forever: replace paths-ignore by a job that skips the steps instead, as ShotDetector's mutation.yml does.)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # A build and a test run a mutation, the threading ones up to three runs: about 6 minutes for the list in all.
  mutation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: ./.github/actions/samples

      - name: Mutate and test
        run: tools/mutation/mutate.py
