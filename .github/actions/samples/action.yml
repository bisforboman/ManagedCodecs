name: FFmpeg and samples
description: >-
  FFmpeg and ImageMagick (../ffmpeg), then tools/make-samples.sh's samples, cached on the scripts, the committed
  samples (samples/jm/, jm-ref/, heaac/ and the rest, which make-samples.sh copies and writes references for: a new one
  must not find the cache of a checkout without it) and the packages.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ffmpeg
      id: ffmpeg

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: samples
      with:
        path: samples
        key: samples-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/make-samples.sh', 'tools/*.py', 'samples/**') }}-${{ steps.ffmpeg.outputs.key }}

    - name: Generate samples
      if: steps.samples.outputs.cache-hit != 'true'
      shell: bash
      run: tools/make-samples.sh
