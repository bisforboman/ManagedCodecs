name: Mono profile (scratch, #345)
# Temporary: on a scratch branch only, never merged.
on:
  push:
    branches: [scratch/mono-profile-345]
permissions:
  contents: read
jobs:
  mono:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: ./.github/actions/samples
      - name: Install Mono 6.12 and perf
        run: |
          sudo gpg --homedir /tmp --no-default-keyring --keyring /usr/share/keyrings/mono-official-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" \
            | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt-get update -q
          sudo apt-get install -y -q mono-runtime mono-devel linux-tools-generic > /dev/null
          perf="$(ls /usr/lib/linux-tools-*/perf | head -1)"
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -q kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
          mono --version
          mono --list-opt || true
      - name: Build
        run: |
          dotnet build tools/ManagedCodecs.Cli -c Release -v q -nologo
          dotnet build tools/ManagedCodecs.Cli.Unity -c Release -v q -nologo
          dotnet build .github/mono-probe -c Release -v q -nologo
          dotnet build .github/mono-probe -c Release -v q -nologo -p:TargetFramework=net10.0 -o probe-net
      - name: Probe
        run: |
          echo "## Mono"; mono .github/mono-probe/bin/Release/netstandard2.1/MonoProbe.exe || mono .github/mono-probe/bin/Release/netstandard2.1/MonoProbe.dll
          echo "## CoreCLR"; dotnet probe-net/MonoProbe.dll
      - name: Profile
        shell: bash
        run: |
          set -euo pipefail
          u=tools/ManagedCodecs.Cli.Unity/bin/Release/netstandard2.1/mcdec.dll
          for spec in "h264-bench-720p.mp4 3" "heaac/heaac-5.1.mp4 30" "aac-stereo-48k.mp4 60" "h264-b-pyramid.mp4 20"; do
            set -- $spec
            echo "=================== $1 ($2 loops) on Mono"
            "$PERF" record -q -e cpu-clock -F 2000 -o perf.data mono --jitmap "$u" "samples/$1" --loops "$2"
            "$PERF" report -i perf.data --no-children --sort dso --percent-limit 1 --stdio 2>/dev/null | grep -v '^#' | grep -v '^$'
            "$PERF" report -i perf.data --no-children --sort symbol --percent-limit 0.4 --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | cut -c1-200
          done
