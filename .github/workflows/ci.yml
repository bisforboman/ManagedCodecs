name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready

# A new push to a pull request supersedes its running checks; pushes to main all run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Builds, generates the FFmpeg samples and references (tools/make-samples.sh), and runs every test: once as is and
  # once with hardware intrinsics off, so the scalar fallbacks of the SIMD paths are checked against FFmpeg too, and
  # MJPEG once more without AVX2, for the Vector128 IDCT that ARM64 runs.
  # Ubuntu 24.04's FFmpeg is 6.1, the version the samples, the AAC tolerance and the tool checks were set up with.
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # The steps take about 5 minutes; the rest is room for a slow Ubuntu mirror on a cache miss (apt once took 27 minutes).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The packages (about 50 MB) come from the Actions cache, not the Ubuntu mirror, which once took 27 minutes. The
      # key is the list of package files apt would fetch now, versions included, so a new version on the mirror
      # makes a new cache entry (the older one's files restored, only the new ones downloaded).
      - name: List the FFmpeg and ImageMagick packages to fetch
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install --print-uris -qq --no-install-recommends ffmpeg imagemagick | awk '{print $2}' | sort > "$RUNNER_TEMP/apt-files.txt"
          echo "key=apt-${{ runner.os }}-${{ runner.arch }}-$(sha256sum "$RUNNER_TEMP/apt-files.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install FFmpeg and ImageMagick
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true ffmpeg imagemagick
          # apt leaves its lock and partial/ to root and _apt; the cache saves the directory as the runner's user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          ls ~/apt-archives | wc -l
          ffmpeg -hide_banner -version | head -1

      - name: Format (StyleBro)
        run: |
          dotnet tool restore
          dotnet tool run stylebro-migrate format ManagedCodecs.slnx --verify-no-changes

      - name: Generate samples
        run: tools/make-samples.sh

      - name: Build
        run: dotnet build ManagedCodecs.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test ManagedCodecs.slnx -c Release --no-build

      - name: Test without hardware intrinsics
        run: dotnet test ManagedCodecs.slnx -c Release --no-build
        env:
          DOTNET_EnableHWIntrinsic: 0

      - name: Test MJPEG without AVX2 (the Vector128 IDCT, which ARM64 runs)
        run: dotnet test ManagedCodecs.slnx -c Release --no-build --filter FullyQualifiedName~Mjpeg
        env:
          DOTNET_EnableAVX2: 0

      - name: mcdec decodes a file with video and audio
        run: dotnet tools/ManagedCodecs.Cli/bin/Release/net10.0/mcdec.dll samples/h264-with-audio.mp4

      # For the wasm job, which checks its output against these files' native decode.
      - name: Upload the samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samples
          path: |
            samples/*.avi
            samples/*.mp4
            samples/*.aac
            samples/jm/*.mp4
            samples/openh264/*.mp4
          retention-days: 1

  # The same on ARM64 (GitHub's arm64 runner): the Vector128 and AdvSimd paths x64 never takes run here, against
  # references made by the runner's own FFmpeg. A job of its own, so the `build` check keeps its name.
  build-arm64:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The packages (about 50 MB) come from the Actions cache, not the Ubuntu mirror, which once took 27 minutes. The
      # key is the list of package files apt would fetch now, versions included, so a new version on the mirror
      # makes a new cache entry (the older one's files restored, only the new ones downloaded).
      - name: List the FFmpeg and ImageMagick packages to fetch
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install --print-uris -qq --no-install-recommends ffmpeg imagemagick | awk '{print $2}' | sort > "$RUNNER_TEMP/apt-files.txt"
          echo "key=apt-${{ runner.os }}-${{ runner.arch }}-$(sha256sum "$RUNNER_TEMP/apt-files.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install FFmpeg and ImageMagick
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true ffmpeg imagemagick
          # apt leaves its lock and partial/ to root and _apt; the cache saves the directory as the runner's user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          ls ~/apt-archives | wc -l
          ffmpeg -hide_banner -version | head -1

      - name: Generate samples
        run: tools/make-samples.sh

      - name: Build
        run: dotnet build ManagedCodecs.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test ManagedCodecs.slnx -c Release --no-build

      - name: Test without hardware intrinsics
        run: dotnet test ManagedCodecs.slnx -c Release --no-build
        env:
          DOTNET_EnableHWIntrinsic: 0

  # The decoders on WebAssembly (browser-wasm, compiled ahead of time as a web app would ship them, run by Node):
  # tools/wasm-check.sh decodes every sample there and natively and fails unless the output is the same. It takes the
  # samples from the build job rather than installing FFmpeg too.
  wasm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # Outside the solution (it needs the workload), so the build job's format check doesn't cover it.
      - name: Format (StyleBro) of the wasm project
        run: |
          dotnet tool restore
          dotnet tool run stylebro-migrate format tools/ManagedCodecs.Wasm/ManagedCodecs.Wasm.csproj --verify-no-changes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: samples
          path: samples

      - name: Decode every sample on WebAssembly and compare with the native output
        run: tools/wasm-check.sh aot
