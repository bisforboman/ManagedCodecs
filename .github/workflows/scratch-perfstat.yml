name: Scratch perf stat
# Scratch, not for merging: hardware counters for one thread against four on the 720p sample.
on:
  push:
    branches: [claude/scratch-perfstat]
permissions:
  contents: read
jobs:
  stat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: ./.github/actions/samples
      - name: Install perf
        run: |
          sudo apt-get install -y -q linux-tools-generic > /dev/null
          perf="$(ls /usr/lib/linux-tools-*/perf | head -1)"
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: Build
        run: |
          dotnet build tools/ManagedCodecs.Cli -c Release -v q
          git fetch -q origin main && git worktree add -q "$RUNNER_TEMP/base" origin/main
          dotnet build "$RUNNER_TEMP/base/tools/ManagedCodecs.Cli" -c Release -v q
      - name: Counters
        env:
          DOTNET_TieredCompilation: '0'
        run: |
          branch=tools/ManagedCodecs.Cli/bin/Release/net10.0/mcdec.dll
          base=$RUNNER_TEMP/base/tools/ManagedCodecs.Cli/bin/Release/net10.0/mcdec.dll
          grep -m1 -E '^(model name|Model)' /proc/cpuinfo || true
          for s in h264-bench-720p.mp4 h264-high-default.mp4; do
            for r in 1 2 3 4 5; do
              for v in main m0 m32 m64; do
                case $v in main) d=$base; m=0;; m0) d=$branch; m=0;; m32) d=$branch; m=32;; m64) d=$branch; m=64;; esac
                MC_WAIT_MARGIN=$m "$PERF" stat -x, -e task-clock,context-switches,cycles,instructions dotnet "$d" "samples/$s" --loops 20 --threads 4 2> ps.txt > out.txt
                echo "$s $v run $r: $(grep -o 'rtime=[0-9.]*s' out.txt) $(grep -o 'stime=[0-9.]*s' out.txt) $(awk -F, '{printf "%s=%s ", $3, $1}' ps.txt)"
              done
            done
          done
