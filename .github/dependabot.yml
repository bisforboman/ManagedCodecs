version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and the composite actions (their pins too).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # One PR a week instead of one per action (each is a full CI run): minor and patch updates together, which
    # dependabot-auto-merge.yml merges once green, and majors together, which wait for a look.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The analyzers (Directory.Packages.props) and the format tool (.config/dotnet-tools.json) move together, in their
    # own PR. While StyleBro is a prerelease (0.x.0-alpha.N) Dependabot never proposes its next version: from a
    # prerelease, NuGet's updater only offers prereleases of the same version or a stable release; move it by hand.
    # The test and benchmark packages: same grouping as the actions.
    groups:
      stylebro:
        patterns: ["StyleBro.*"]
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
      nuget-major:
        patterns: ["*"]
        update-types: [major]
