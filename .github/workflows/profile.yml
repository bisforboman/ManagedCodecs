name: Profile

# Where mcdec spends its time on the hosted x64 and ARM64 runners: perf samples one decode of a sample (steady state:
# tiered compilation off, enough loops that the JIT's start is a few percent) and the run summary lists the functions
# above a share, by symbol and by library. For a machine the cloud VM can't be (ARM64), before a change aimed at it;
# CLAUDE.md, Timing, says how to read perf shares. Dispatch it ("Run workflow", or `gh workflow run profile.yml
# --ref <branch> -f sample=<name>`). `tiering: pgo` profiles the runtime's defaults instead (tiered compilation and
# dynamic PGO), from `delay` ms on so that the warm-up is left out; `event: instructions` samples by retired
# instructions where the runner has hardware counters (the ARM64 one; the x64 one falls back to the clock). Both
# report `perf stat`'s instruction and cycle totals where counters exist (issue #346). `stages` adds H.264's shares by
# stage (tools/h264-stages.py).
on:
  workflow_dispatch:
    inputs:
      sample:
        description: The sample to decode, as tools/bench.py names it (under samples/)
        default: testsrc-420.avi
      loops:
        description: mcdec's --loops
        default: '200'
      threshold:
        description: The smallest share listed, in percent
        default: '0.5'
      tiering:
        description: off (mcdec's own setting, fully optimized at the first call) or pgo (the runtime's defaults)
        type: choice
        options: ['off', pgo]
        default: 'off'
      delay:
        description: Milliseconds before perf starts sampling (leave out the warm-up, under pgo especially)
        default: '0'
      event:
        description: cpu-clock, or instructions where the runner has hardware counters
        type: choice
        options: [cpu-clock, instructions]
        default: cpu-clock
      stages:
        description: Also H.264's shares by stage (tools/h264-stages.py; records call chains, ReadyToRun off)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: ./.github/actions/samples

      - name: Install perf
        run: |
          sudo apt-get install -y -q linux-tools-generic > /dev/null
          # The runner's kernel has no matching linux-tools package; the generic one's perf works with it.
          perf="$(ls /usr/lib/linux-tools-*/perf | head -1)"
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -q kernel.perf_event_paranoid=1 kernel.kptr_restrict=0

      - name: Build
        run: dotnet build tools/ManagedCodecs.Cli -c Release

      - name: Profile
        env:
          SAMPLE: ${{ inputs.sample }}
          LOOPS: ${{ inputs.loops }}
          THRESHOLD: ${{ inputs.threshold }}
          TIERING: ${{ inputs.tiering }}
          DELAY: ${{ inputs.delay }}
          EVENT: ${{ inputs.event }}
          STAGES: ${{ inputs.stages }}
          # The JIT's code by name (a perf map), without double mapping (else it shows as bare addresses).
          DOTNET_PerfMapEnabled: '1'
          DOTNET_EnableWriteXorExecute: '0'
        run: |
          mcdec=tools/ManagedCodecs.Cli/bin/Release/net10.0/mcdec.dll
          # mcdec's project turns tiering off; the variable overrides it for pgo.
          if [ "$TIERING" = pgo ]; then export DOTNET_TieredCompilation=1; else export DOTNET_TieredCompilation=0; fi
          # Sampling by instructions needs hardware counters; without them, the clock.
          if [ "$EVENT" = instructions ] && ! "$PERF" stat -e instructions -x, true 2>&1 | grep -qE 'not (supported|counted)'; then
            sampling=(-e instructions -c 1000000)
          else
            EVENT=cpu-clock
            sampling=(-e cpu-clock -F 2000)
          fi
          # -D only for a real delay: the runner's perf (Ubuntu's generic 6.8) rejects -D 0, which is the default.
          delay=()
          if [ "$DELAY" -gt 0 ] 2>/dev/null; then delay=(-D "$DELAY"); fi
          # By stage: call chains, and CoreLib jitted so that its helpers (Memmove) have names (tools/h264-stages.py).
          chains=()
          if [ "$STAGES" = true ]; then chains=(-g); export DOTNET_ReadyToRun=0; fi
          "$PERF" record -q "${sampling[@]}" "${delay[@]}" "${chains[@]}" -o perf.data dotnet "$mcdec" "samples/$SAMPLE" --loops "$LOOPS" | tee mcdec.txt
          if ! "$PERF" report -i perf.data --stdio 2>/dev/null | grep -q '%'; then
            echo "::error::perf recorded no samples: the delay ($DELAY ms) outlasted the decode; raise loops or lower the delay."
            exit 1
          fi
          # Totals for the whole process (warm-up included), where the runner counts them.
          "$PERF" stat -e instructions,cycles -x, -o stat.txt dotnet "$mcdec" "samples/$SAMPLE" --loops "$LOOPS" > /dev/null || true
          cpu="$(grep -m1 -E '^(model name|Model)' /proc/cpuinfo | cut -d: -f2 | xargs || uname -m)"
          {
            echo "### $(uname -m) ($cpu): \`$SAMPLE\`, $LOOPS loops, tiering $TIERING, $EVENT from $DELAY ms, $(git rev-parse --short HEAD)"
            echo
            echo '```'
            grep -E '^(decoded|bench|last loop)' mcdec.txt
            echo '```'
            echo
            echo 'perf stat, the whole process (another run):'
            echo
            echo '```'
            grep -E 'instructions|cycles' stat.txt || echo 'no counters'
            echo '```'
            echo
            echo "By library:"
            echo
            echo '```'
            "$PERF" report -i perf.data --no-children --sort dso --percent-limit "$THRESHOLD" --stdio 2>/dev/null | grep -v '^#' | grep -v '^$'
            echo '```'
            echo
            echo "By function (above $THRESHOLD%):"
            echo
            echo '```'
            # Signatures shortened: the parameter list and the [Optimized] tag go.
            "$PERF" report -i perf.data --no-children --sort symbol --percent-limit "$THRESHOLD" --stdio 2>/dev/null \
              | grep -v '^#' | grep -v '^$' | sed -E 's/\(.*\)\[[A-Za-z0-9]+\]//; s/\[\.\] //' | cut -c1-160
            echo '```'
            if [ "$STAGES" = true ]; then
              echo
              # Code inlined into a caller counts as the caller's stage (perf sees no inlined frames), so compare
              # tiering off and pgo on groups of stages as well as on single ones.
              echo "By stage (tools/h264-stages.py, $EVENT samples):"
              echo
              tools/h264-stages.py --perf "$PERF" --ours perf.data
            fi
          } > report.md
          # In the log too, where the API reads it (a run summary has no API).
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
